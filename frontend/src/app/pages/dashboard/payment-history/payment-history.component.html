<!-- Componente que muestra el historial de pagos -->
<div class="row">
    <div class="col-lg-12">
        <mat-card class="cardWithShadow">
            <mat-card-content class="p-24">
                <!-- Contenedor de la tabla -->
                <div class="table-section table-responsive payment-history">
					<div class="agendaForm" style="display: flex; justify-content: space-between; margin-top: 10px;">
						<!-- Barra de búsqueda -->
						<mat-form-field class="search-bar">
							<mat-icon matPrefix>search</mat-icon>
							<input matInput [formControl]="nameFilter" placeholder="Buscar">
						</mat-form-field>

						<!-- Contenedor de la barra de búsqueda y el botón de filtrado -->
						<div class="search-header" style="display: flex; align-items: start;">
							<!-- Botón para desplegar la lista de filtros -->
							<div class="filter-container">
								<button mat-icon-button (click)="toggleFilterDropdown()">
									<mat-icon>filter_alt</mat-icon>
								</button>

								<div *ngIf="isFilterDropdownOpen" class="filter-dropdown">
									<mat-checkbox [(ngModel)]="filters.clients" (change)="fetchFilteredData()">Clientes</mat-checkbox>
									<mat-checkbox [(ngModel)]="filters.collaborators" (change)="fetchFilteredData()">Colaboradores</mat-checkbox>
								</div>
							</div>

							<mat-form-field appearance="outline" color="primary">
								<mat-label>Elementos por página</mat-label>
								<mat-select [(value)]="pageSize" (selectionChange)="onPageSizeChange($event.value)">
									<mat-option value="50">50</mat-option>
									<mat-option value="100">100</mat-option>
									<mat-option value="200">200</mat-option>
								</mat-select>
							</mat-form-field>
						</div>
					</div>
					<!-- class="mat-elevation-z8 centered-table" Esta clase se la quite al table para eliminar el diseño de la tabla bordeada-->
                    <table mat-table [dataSource]="dataSource" matSort>

                        <!-- Columna para mostrar la fecha -->
                        <ng-container matColumnDef="date">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header class="box">Fecha</th>
                            <td mat-cell *matCellDef="let row">{{
                                row.date }}</td>
                        </ng-container>

                        <!-- Columna para mostrar el nombre del cliente -->
                        <ng-container matColumnDef="client">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header class="box">Nombre</th>
                            <td mat-cell *matCellDef="let row">{{ row.clientName }}</td>
                        </ng-container>

                        <!-- Columna para mostrar el nombre del servicio -->
                        <ng-container matColumnDef="service">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header class="box">Servicio</th>
                            <td mat-cell *matCellDef="let row">{{ row.serviceName }}</td>
                        </ng-container>

					<!-- Moneda -->
					<ng-container matColumnDef="currency">
    	                    <th mat-header-cell *matHeaderCellDef mat-sort-header class="box">Moneda</th>
                            <td mat-cell *matCellDef="let row">{{ row.currency }}</td>
					</ng-container>

                        <!-- Columna para mostrar el valor del precio -->
                        <ng-container matColumnDef="price">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header class="box">Precio</th>
                            <td mat-cell *matCellDef="let row" style="text-align: right;">
                                {{ row.price | number:'1.0-0' }}
                            </td>
                        </ng-container>

                        <!-- Columna para mostrar el estado de pago -->
                        <ng-container matColumnDef="is_payed">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header class="box">Pagado</th>
                            <td mat-cell *matCellDef="let row" style="text-align: center;">
                                <span [ngClass]="{'paid': row.is_payed, 'unpaid': !row.is_payed}">
                                    {{ row.is_payed ? 'Si' : 'No' }}
                                </span>
                            </td>
                        </ng-container>


						<!-- Columna para el ícono de basura -->
						<ng-container *ngIf="user?.rol === 'Super Admin'" matColumnDef="acciones">
							<th mat-header-cell *matHeaderCellDef class="box">Eliminar</th>
							<td mat-cell *matCellDef="let row" style="text-align: center;">
								<button mat-icon-button color="warn" (click)="eliminarFila(row)">
									<mat-icon>delete</mat-icon>
								</button>
							</td>
						</ng-container>


                        <!-- Fila para mostrar los encabezados -->
                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

                        <!-- Fila para mostrar los datos -->
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    </table>
                </div>

                <!-- Paginador -->
                <mat-paginator [pageSize]="pageSize" [pageIndex]="pageIndex"
                        (page)="onPageChange($event)" aria-label="Selector de página"></mat-paginator>
            </mat-card-content>
        </mat-card>
    </div>
</div>
