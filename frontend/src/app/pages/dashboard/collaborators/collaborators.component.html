<div class="row collaborator">
    <div class="col-lg-12">
        <mat-card class="cardWithShadow">
            <mat-card-content class="p-24">

                <!-- Botón para alternar entre vistas -->
                <div class="view-toggle">
                    <button mat-icon-button color="primary" (click)="toggleView('list')">
                        <mat-icon>list</mat-icon>
                    </button>
                    <button mat-icon-button color="primary" (click)="toggleView('grid')">
                        <mat-icon>grid_view</mat-icon>
                    </button>
                </div>

                <!-- Si no hay colaboradores, muestra un mensaje y un botón para crear uno -->
                <div *ngIf="!collaboratorItems || collaboratorItems.length === 0" class="no-events"
                    (click)="openAddCollaboratorModal()">
                    <p>No hay colaboradores creados</p>
                    <button mat-flat-button color="primary" class="m-t-20">
                        Crear nuevo colaborador
                    </button>
                </div>

                <!-- Vista de tarjetas -->
                <div *ngIf="viewMode === 'grid' && collaboratorItems && collaboratorItems.length > 0">
                    <div class="row">
                        <div class="col-lg-3" *ngFor="let collaboratorItem of collaboratorItems">
                            <mat-card class="collaborator-card shadow" class="tam_cart"
                                (click)="openCollaboratorModal(collaboratorItem)">
                                <mat-card-header class="collaborator-header">
                                    <img [src]="collaboratorItem.photo || 'assets/img/profile/profile-default.png'"
                                        alt="colaborador" width="100" class="rounded-circle service-image" />
                                    <mat-card-title class="collaborator-name">
                                        {{ collaboratorItem.fullname }}
                                    </mat-card-title>
                                    <mat-card-subtitle class="collaborator-position">
                                        {{ collaboratorItem.rol }}
                                    </mat-card-subtitle>
                                </mat-card-header>
                            </mat-card>
                        </div>
                    </div>
                </div>

                <!-- Vista de lista -->
                <div *ngIf="viewMode === 'list' && collaboratorItems && collaboratorItems.length > 0"
                    class="table-section table-responsive">
                    <!-- Selector de tamaño de página -->
                    <div class="agendaForm" style="margin-top: 10px; display: flex; justify-content: space-between;">
						<mat-form-field class="search-bar">
							<mat-icon matPrefix>search</mat-icon>
							<input matInput [formControl]="nameFilter" placeholder="Buscar">
						</mat-form-field>

                        <mat-form-field appearance="outline" color="primary">
                            <mat-label>Elementos por página</mat-label>
                            <mat-select [(value)]="pageSize" (selectionChange)="onPageSizeChange($event.value)">
                                <mat-option value="50">50</mat-option>
                                <mat-option value="100">100</mat-option>
                                <mat-option value="200">200</mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>

                    <table mat-table
                        [dataSource]="filteredCollaborators.slice((pageIndex * pageSize), ((pageIndex + 1) * pageSize))">
                        <!-- Imagen -->
                        <ng-container matColumnDef="photo">
                            <th mat-header-cell *matHeaderCellDef class="box"> Imagen </th>
                            <td mat-cell *matCellDef="let collaboratorItem" style="text-align: center;">
                                <img [src]="collaboratorItem.photo || 'assets/img/profile/profile-default.png'"
                                    alt="Imagen" width="50" class="rounded-circle" />
                            </td>
                        </ng-container>

                        <!-- Nombre -->
                        <ng-container matColumnDef="fullname">
                            <th mat-header-cell *matHeaderCellDef class="box"> Nombre </th>
                            <td mat-cell *matCellDef="let collaboratorItem" style="text-align: center;">
                                {{ collaboratorItem.fullname }}
                            </td>
                        </ng-container>

                        <!-- Cargo -->
                        <ng-container matColumnDef="rol">
                            <th mat-header-cell *matHeaderCellDef class="box"> Cargo </th>
                            <td mat-cell *matCellDef="let collaboratorItem" style="text-align: center;">
                                {{ collaboratorItem.rol }}
                            </td>
                        </ng-container>

                        <!-- Correo electrónico -->
                        <ng-container matColumnDef="email">
                            <th mat-header-cell *matHeaderCellDef class="box"> Correo electrónico </th>
                            <td mat-cell *matCellDef="let collaboratorItem" style="text-align: center;">
                                {{ collaboratorItem.email }}
                            </td>
                        </ng-container>

                        <!-- Fila clickeable -->
                        <tr mat-header-row *matHeaderRowDef="['photo', 'fullname', 'rol', 'email']"></tr>
                        <tr mat-row
                            *matRowDef="let collaboratorItem; columns: ['photo', 'fullname', 'rol', 'email'];"
                            (click)="openCollaboratorModal(collaboratorItem)" class="clickable-row">
                        </tr>
                    </table>

                    <!-- Paginador -->
                    <mat-paginator [length]="filteredCollaborators.length" [pageSize]="pageSize" [pageIndex]="pageIndex"
                        (page)="onPageChange($event)">
                    </mat-paginator>
                </div>

                <!-- Botón para crear un nuevo colaborador -->
                <button *ngIf="user.is_staff" mat-fab color="primary" class="fab-button" (click)="openAddCollaboratorModal()">
                    <mat-icon>add</mat-icon>
                </button>
            </mat-card-content>
        </mat-card>
    </div>
</div>
