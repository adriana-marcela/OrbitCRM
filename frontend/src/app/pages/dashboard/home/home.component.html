<!-- Componente que muestra el calendario y los eventos de hoy -->
<div class="row">
    <!-- Columna para mostrar las Tareas y actividades -->
    <div class="col-lg-4">
        <div class="row">
            <div class="col-lg-12 col-sm-6">
                <mat-card class="cardWithShadow">
                    <mat-card-content class="p-24">
                        <!-- Título de la sección -->
                        <mat-card-title>Tareas y actividades</mat-card-title>

                        <!-- Contenido de la sección -->
                        <div *ngIf="!filteredAgendaItems || filteredAgendaItems.length === 0" class="no-events">
                            <!-- Mensaje cuando no hay eventos -->
                            <p>No hay tareas el día de hoy</p>
                            <!-- Botón para crear un nuevo evento -->
                            <button mat-flat-button color="primary" class="m-t-20" (click)="addEvent()">
                                Crear una nueva tarea
                            </button>
                        </div>

                        <!-- Contenido cuando hay eventos -->
                        <div *ngIf="filteredAgendaItems && filteredAgendaItems.length > 0">
                            <!-- Componente timeline -->
                            <div class="timeline m-t-30">
                                <!-- Itera sobre los eventos -->
                                <div class="timeline-item d-flex overflow-hidden" *ngFor="let agendaItem of filteredAgendaItems">
                                    <!-- Hora del evento -->
                                    <div class="time text-right mat-subtitle-1 f-s-14">
                                        {{ agendaItem.time }}
										<div class="client-name text-muted f-s-14">
											{{ agendaItem.corporate_name }}
										</div>
                                    </div>


                                    <!-- Punto en el timeline -->
                                    <div class="point d-flex align-items-center">
                                        <!-- Bola del timeline -->
                                        <span class="timeline-badge border-{{agendaItem.priority}} m-y-8"></span>
                                        <!-- Línea del timeline -->
                                        <span class="timline-border d-block"></span>
                                    </div>

                                    <!-- Descripción del evento -->
                                    <div class="desc">
                                        <!-- Título del evento -->
                                        <ng-template [ngIf]="agendaItem.title">
                                            <span class="mat-subtitle-1 f-s-14 lh-20 f-w-600 d-block">
                                                {{ agendaItem.title }}
                                            </span>
                                        </ng-template>

                                        <!-- Descripción del evento -->
                                        <ng-template [ngIf]="agendaItem.subtext">
                                            <span class="mat-body-1 f-s-14 lh-20">
                                                {{ agendaItem.subtext }}
                                            </span>
                                        </ng-template>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </mat-card-content>
                </mat-card>
            </div>

            <!-- Notificaciones -->
	<div class="col-lg-12 col-sm-6">
  		<mat-card class="cardWithShadow">
   		 <mat-card-content class="p-24">
      	<mat-card-title>Notificaciones</mat-card-title>

      		<div *ngIf="notifications.length === 0" class="no-events">
        		<p>No hay notificaciones nuevas para ti</p>
      		</div>

      		<div class="notification-container" *ngIf="notifications.length > 0">
        		<div *ngFor="let noti of notifications" class="notification-box">
          		<div class="notification-header">
            		<span class="notification-date">{{ noti.date | date:'yyyy/MM/dd' }}</span>
          		</div>
          		<div class="notification-body" [innerHTML]="noti.message">
          		</div>
        		</div>
      		</div>
   	 		</mat-card-content>
  			</mat-card>
			</div>
        </div>
    </div>

    <!-- Columna para mostrar el calendario -->
    <div class="col-lg-8 custom-calendar-container">
        <mat-card class="cardWithShadow">
            <mat-card-content class="p-24">
                <!-- Componente calendario -->
                <full-calendar [options]="calendarOptions" (dateClick)="handleDateClick($event)"></full-calendar>
            </mat-card-content>
        </mat-card>
    </div>
</div>
