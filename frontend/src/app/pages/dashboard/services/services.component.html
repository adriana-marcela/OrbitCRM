<div class="row">
    <div class="col-lg-12">
        <mat-card class="cardWithShadow">
            <mat-card-content class="p-24">

                <!-- Botón para alternar entre vistas -->
                <div class="view-toggle">
                    <button mat-icon-button color="primary" (click)="toggleView('list')">
                        <mat-icon>list</mat-icon>
                    </button>
                    <button mat-icon-button color="primary" (click)="toggleView('grid')">
                        <mat-icon>grid_view</mat-icon>
                    </button>
                </div>

                <!-- Si no hay servicios, muestra un mensaje -->
                <div *ngIf="!serviceItems || serviceItems.length === 0" class="no-events">
                    <p>No hay servicios creados</p>
                    <button mat-flat-button color="primary" class="m-t-20" (click)="openServiceModal()">
                        Crear nuevo servicio
                    </button>
                </div>

                <!-- Vista de tarjetas -->
                <div *ngIf="viewMode === 'grid' && serviceItems && serviceItems.length > 0">
                    <div class="row">
                        <div class="col-lg-3" *ngFor="let serviceItem of serviceItems">
                            <mat-card class="collaborator-card shadow" (click)="openServiceModal(serviceItem)" class="tam_cart_services">
                                <mat-card-header class="collaborator-header">
                                    <img [src]="serviceItem.img || 'assets/img/profile/profile-default.png'" alt="users"
                                        width="100" class="rounded-circle service-image" />
                                    <mat-card-title class="collaborator-name">{{ serviceItem.name }}</mat-card-title>
                                    <mat-card-subtitle class="collaborator-position">{{ serviceItem.category
                                        }}</mat-card-subtitle>
                                </mat-card-header>
                     			<mat-card-content class="collaborator-info">{{ serviceItem.description }}</mat-card-content>

								<mat-card-content>
       							<span *ngIf="serviceItem.url">
           						<div class="button-container">
               					<a [href]="serviceItem.url" target="_blank" rel="noopener noreferrer" class="custom-button" (click)="$event.stopPropagation()">
                   					<span class="icon">🔗</span> URL
               					</a>
          					 	</div>
       							</span>
								</mat-card-content>

                            </mat-card>
                        </div>
                    </div>
                </div>

                <!-- Vista de lista -->
                <div *ngIf="viewMode === 'list' && serviceItems && serviceItems.length > 0"
                    class="table-section table-responsive payment-history">

                    <!-- Selector de tamaño de página -->
					<div class="agendaForm" style="margin-top: 10px; display: flex; justify-content: space-between;">
						<!-- Barra de búsqueda -->
						<mat-form-field class="search-bar">
							<mat-icon matPrefix>search</mat-icon>
							<input matInput [formControl]="nameFilter" placeholder="Buscar">
						</mat-form-field>

						<mat-form-field appearance="outline" color="primary">
							<mat-label>Elementos por página</mat-label>
							<mat-select [(value)]="pageSize" (selectionChange)="onPageSizeChange($event.value)">
								<mat-option value="50">50</mat-option>
								<mat-option value="100">100</mat-option>
								<mat-option value="200">200</mat-option>
							</mat-select>
						</mat-form-field>
					</div>
					<!-- class="mat-elevation-z8 centered-table" Esta clase es para el diseño del contenedor -->
					<table mat-table [dataSource]="filteredServices.slice((pageIndex * pageSize), ((pageIndex + 1) * pageSize))">
                        <!-- Logo -->
                        <ng-container matColumnDef="img">
                            <th mat-header-cell *matHeaderCellDef class="box"> Logo </th>
                            <td mat-cell *matCellDef="let serviceItem" style="text-align: center;">
                                <img [src]="serviceItem.img || 'assets/img/profile/profile-default.png'" alt="Logo"
                                    width="50" class="rounded-circle" />
                            </td>
                        </ng-container>

                        <!-- Nombre -->
                        <ng-container matColumnDef="name">
                            <th mat-header-cell *matHeaderCellDef class="box"> Nombre </th>
                            <td mat-cell *matCellDef="let serviceItem" style="text-align: left;"> {{ serviceItem.name}} </td>
                        </ng-container>

                        <!-- Categoría -->
                        <ng-container matColumnDef="category">
                            <th mat-header-cell *matHeaderCellDef class="box"> Categoría </th>
                            <td mat-cell *matCellDef="let serviceItem" style="text-align: center;"> {{
                                serviceItem.category }} </td>
                        </ng-container>

                        <!-- Descripción -->
                        <ng-container matColumnDef="description">
                            <th mat-header-cell *matHeaderCellDef class="box"> Descripción </th>
                            <td mat-cell *matCellDef="let serviceItem" style="text-align: left;"> {{
                                serviceItem.description }} </td>
                        </ng-container>

                       <!-- URL del servicio -->
						<ng-container matColumnDef="url">
    						<th mat-header-cell *matHeaderCellDef class="box">URL</th>
    						<td mat-cell *matCellDef="let serviceItem" style="text-align: center;">
        						<a *ngIf="serviceItem.url"
           						[href]="serviceItem.url"
           						target="_blank"
           						rel="noopener noreferrer"
           						(click)="$event.stopPropagation()"
           						class="custom-button">
            						<span class="icon">🔗</span>
        						</a>
    						</td>
						</ng-container>

                        <!-- Fila clickeable -->
                        <tr mat-header-row *matHeaderRowDef="['img', 'name', 'category', 'description', 'url']"></tr>
                        <tr mat-row *matRowDef="let serviceItem; columns: ['img', 'name', 'category', 'description', 'url'];"
                            (click)="openServiceModal(serviceItem)" class="clickable-row">
                        </tr>
                    </table>

                    <!-- Paginador -->
                    <mat-paginator [length]="filteredServices.length" [pageSize]="pageSize" [pageIndex]="pageIndex"
                        (page)="onPageChange($event)">
                    </mat-paginator>
                </div>

                <!-- Botón para crear un nuevo servicio -->
                <button *ngIf="user.is_staff" mat-fab color="primary" class="fab-button" (click)="openServiceModal()">
                    <mat-icon>add</mat-icon>
                </button>
            </mat-card-content>
        </mat-card>
    </div>
</div>
